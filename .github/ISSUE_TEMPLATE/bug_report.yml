name: Bug report
description: Something in the app isn't working
body:
  - type: markdown
    attributes:
      value: >
        Please remove your server address, username and password from everything you paste.
        Retune can't help with provider accounts or finding sources.
        For security problems, follow SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Retune version, macOS version and Mac model
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source type
      options:
        - Xtream Codes
        - M3U URL
        - M3U file
    validations:
      required: true
